<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>AR 互動自拍相框</title>
    <style>
      * {
        box-sizing: border-box;
        touch-action: none; /* 防止手機手勢干擾拖曳 */
      }
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      #stage-container {
        position: relative;
        width: 100vw;
        height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      /* 鏡頭畫面：支援縮放與平移 */
      #camera-video {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
        transform-origin: center center;
        will-change: transform;
      }

      /* 相框層：photo_frame.png 置頂完整顯示 */
      #frame-overlay {
        position: absolute;
        width: 100%;
        height: 100%;
        background-image: url('./photo_frame.png');
        background-repeat: no-repeat;
        background-position: center center;
        background-size: contain;
        pointer-events: none;
        z-index: 2;
      }

      /* 開場授權遮罩層 */
      #start-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100dvh;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        padding: 20px;
        text-align: center;
      }

      .start-title {
        color: #ffd700;
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 12px;
      }

      .start-desc {
        color: #fff;
        font-size: 15px;
        margin-bottom: 28px;
        line-height: 1.5;
      }

      #start-btn {
        background: linear-gradient(135deg, #e60012, #ff4a4a);
        color: #fff;
        font-size: 18px;
        font-weight: bold;
        padding: 14px 36px;
        border-radius: 30px;
        border: 2px solid #ffd700;
        box-shadow: 0 4px 20px rgba(230, 0, 18, 0.5);
        cursor: pointer;
      }

      /* 縮放微調控制列（相框位置小專用） */
      .zoom-panel {
        position: fixed;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding: 12px 8px;
        border-radius: 24px;
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        z-index: 10;
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      .zoom-btn {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
        border: none;
        font-size: 18px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      /* 底部操作區 */
      .ui-bar {
        position: fixed;
        bottom: calc(20px + env(safe-area-inset-bottom));
        left: 0;
        width: 100%;
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        z-index: 10;
      }

      .btn-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 32px;
      }

      #shutter-btn {
        width: 74px;
        height: 74px;
        border-radius: 50%;
        background: #e60012;
        border: 4px solid #fff;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        cursor: pointer;
        transition: transform 0.1s;
      }
      #shutter-btn:active {
        transform: scale(0.9);
      }

      #switch-btn {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 2px solid rgba(255, 255, 255, 0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      #switch-btn svg {
        width: 24px;
        height: 24px;
        fill: #fff;
      }

      .hint {
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        background: rgba(0, 0, 0, 0.6);
        padding: 6px 16px;
        border-radius: 20px;
        border: 1px solid rgba(255, 215, 0, 0.8);
      }

      #render-canvas {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- 開場引導點擊層 -->
    <div id="start-screen">
      <div class="start-title">📸 AR 自拍相框 📸</div>
      <div class="start-desc">請點擊下方按鈕並允許相機權限<br>即可開始合照體驗</div>
      <button id="start-btn" onclick="userStart()">開啟相機</button>
    </div>

    <!-- 舞台畫面區 (支援單指滑動調整人像位置) -->
    <div id="stage-container" id="stage">
      <video id="camera-video" autoplay playsinline muted></video>
      <div id="frame-overlay"></div>
    </div>

    <!-- 側邊縮放調整器：解決相框人臉空間太細的問題 -->
    <div class="zoom-panel" id="zoom-panel">
      <button class="zoom-btn" onclick="changeZoom(0.1)">＋</button>
      <span id="zoom-val" style="color: #fff; font-size: 11px;">1.0x</span>
      <button class="zoom-btn" onclick="changeZoom(-0.1)">－</button>
    </div>

    <!-- 底部操作列 -->
    <div class="ui-bar" id="ui-bar">
      <div class="hint">可單指滑動或按右側「－」縮小人像</div>
      <div class="btn-row">
        <div style="width: 48px;"></div>
        <button id="shutter-btn" onclick="captureAndSave()" aria-label="拍照"></button>
        <button id="switch-btn" onclick="toggleCamera()" aria-label="切換鏡頭">
          <svg viewBox="0 0 24 24">
            <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
          </svg>
        </button>
      </div>
    </div>

    <canvas id="render-canvas"></canvas>

    <script>
      const video = document.getElementById('camera-video');
      const canvas = document.getElementById('render-canvas');
      const startScreen = document.getElementById('start-screen');
      const uiBar = document.getElementById('ui-bar');
      const zoomPanel = document.getElementById('zoom-panel');
      const zoomVal = document.getElementById('zoom-val');
      const stage = document.getElementById('stage-container');

      const frameImg = new Image();
      frameImg.src = './photo_frame.png';

      let currentFacingMode = 'user';
      let currentStream = null;

      // 人像縮放與位置參數
      let scale = 0.85; // 預設微調為 0.85x，避免人臉過大塞不進相框
      let offsetX = 0;
      let offsetY = 0;

      function updateVideoTransform() {
        const mirror = currentFacingMode === 'user' ? -1 : 1;
        video.style.transform = `translate(${offsetX}px, ${offsetY}px) scaleX(${mirror * scale}) scaleY(${scale})`;
        zoomVal.innerText = `${scale.toFixed(1)}x`;
      }

      function changeZoom(delta) {
        scale = Math.min(Math.max(0.4, scale + delta), 2.0); // 最小可縮至 0.4x
        updateVideoTransform();
      }

      // 單指拖曳人像對準相框孔位
      let isDragging = false;
      let startX, startY;

      stage.addEventListener('pointerdown', (e) => {
        isDragging = true;
        startX = e.clientX - offsetX;
        startY = e.clientY - offsetY;
      });

      window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        offsetX = e.clientX - startX;
        offsetY = e.clientY - startY;
        updateVideoTransform();
      });

      window.addEventListener('pointerup', () => { isDragging = false; });
      window.addEventListener('pointercancel', () => { isDragging = false; });

      // 使用者點擊啟動
      async function userStart() {
        startScreen.style.display = 'none';
        uiBar.style.display = 'flex';
        zoomPanel.style.display = 'flex';
        await initCamera(currentFacingMode);
      }

      async function initCamera(facingMode) {
        if (currentStream) {
          currentStream.getTracks().forEach(track => track.stop());
        }

        try {
          const constraints = {
            audio: false,
            video: {
              facingMode: { ideal: facingMode },
              width: { ideal: 1920 },
              height: { ideal: 1080 }
            }
          };

          currentStream = await navigator.mediaDevices.getUserMedia(constraints);
          video.srcObject = currentStream;
          currentFacingMode = facingMode;
          updateVideoTransform();
        } catch (err) {
          alert('請確保於 Safari / Chrome 打開，並允許使用相機權限。');
          console.error(err);
        }
      }

      function toggleCamera() {
        const targetMode = currentFacingMode === 'user' ? 'environment' : 'user';
        initCamera(targetMode);
      }

      // 拍照並按照調整好的縮放與位移精準合成
      async function captureAndSave() {
        if (!video.videoWidth || !frameImg.complete) return;

        const targetWidth = frameImg.naturalWidth || 1080;
        const targetHeight = frameImg.naturalHeight || 1920;

        canvas.width = targetWidth;
        canvas.height = targetHeight;
        const ctx = canvas.getContext('2d');

        // 基準比例計算
        const vWidth = video.videoWidth;
        const vHeight = video.videoHeight;
        const videoRatio = vWidth / vHeight;
        const frameRatio = targetWidth / targetHeight;

        let baseWidth, baseHeight;
        if (videoRatio > frameRatio) {
          baseHeight = targetHeight;
          baseWidth = targetHeight * videoRatio;
        } else {
          baseWidth = targetWidth;
          baseHeight = targetWidth / videoRatio;
        }

        // 計算縮放及使用者螢幕拖曳映射至畫布的比例
        const screenWidth = window.innerWidth;
        const screenHeight = window.innerHeight;
        const mappedOffsetX = (offsetX / screenWidth) * targetWidth;
        const mappedOffsetY = (offsetY / screenHeight) * targetHeight;

        const drawWidth = baseWidth * scale;
        const drawHeight = baseHeight * scale;

        ctx.save();
        // 移動至畫布中央並加上使用者的平移位移
        ctx.translate((targetWidth / 2) + mappedOffsetX, (targetHeight / 2) + mappedOffsetY);

        if (currentFacingMode === 'user') {
          ctx.scale(-1, 1);
        }

        // 居中繪製縮放後的人像
        ctx.drawImage(video, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
        ctx.restore();

        // 疊加相框層 (photo_frame.png)
        ctx.drawImage(frameImg, 0, 0, targetWidth, targetHeight);

        // 儲存至相簿
        canvas.toBlob(async (blob) => {
          const file = new File([blob], `PhotoFrame_${Date.now()}.png`, { type: 'image/png' });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({
                files: [file],
                title: 'AR 相框合照',
                text: '快來看看我的 AR 合照！'
              });
            } catch (error) {
              if (error.name !== 'AbortError') {
                fallbackDownload(blob);
              }
            }
          } else {
            fallbackDownload(blob);
          }
        }, 'image/png');
      }

      function fallbackDownload(blob) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `PhotoFrame_${Date.now()}.png`;
        a.click();
        URL.revokeObjectURL(url);
      }
    </script>
  </body>
</html>
